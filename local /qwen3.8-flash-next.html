<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #1e1e2f, #2d2d44);
    font-family: Arial, sans-serif;
  }

  #clock {
    background: #f5f5f5;
    border-radius: 50%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>

<canvas id="clock" width="400" height="400"></canvas>

<script>
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const radius = canvas.width / 2;
  const center = radius;

  function drawClock() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Face
    ctx.beginPath();
    ctx.arc(center, center, radius - 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#f5f5f5';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#333';
    ctx.stroke();

    // Hour numbers
    ctx.fillStyle = '#333';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 1; i <= 12; i++) {
      const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
      const x = center + Math.cos(angle) * (radius - 40);
      const y = center + Math.sin(angle) * (radius - 40);
      ctx.fillText(i, x, y);
    }

    // Minute tick marks
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * 2 * Math.PI;
      const isHour = i % 5 === 0;
      const outer = radius - 12;
      const inner = radius - (isHour ? 12 : 22);
      ctx.beginPath();
      ctx.moveTo(center + Math.sin(angle) * inner, center - Math.cos(angle) * inner);
      ctx.lineTo(center + Math.sin(angle) * outer, center - Math.cos(angle) * outer);
      ctx.lineWidth = isHour ? 3 : 1;
      ctx.strokeStyle = '#888';
      ctx.stroke();
    }

    const now = new Date();
    const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
    const minutes = now.getMinutes() + seconds / 60;
    const hours = now.getHours() % 12 + minutes / 60;

    drawHand(hours / 12 * 2 * Math.PI, radius * 0.5, 8, '#333');   // hour
    drawHand(minutes / 60 * 2 * Math.PI, radius * 0.75, 5, '#333'); // minute
    drawHand(seconds / 60 * 2 * Math.PI, radius * 0.85, 2, '#e63946'); // second

    // Center cap
    ctx.beginPath();
    ctx.arc(center, center, 8, 0, 2 * Math.PI);
    ctx.fillStyle = '#e63946';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(center, center, 4, 0, 2 * Math.PI);
    ctx.fillStyle = '#333';
    ctx.fill();

    requestAnimationFrame(drawClock);
  }

  function drawHand(angle, length, width, color) {
    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 15); // small tail behind center
    ctx.lineTo(0, -length);
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.stroke();
    ctx.restore();
  }

  drawClock();
</script>

</body>
</html>
