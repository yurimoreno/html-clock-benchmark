<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #2b2f36, #14161a);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .clock-wrap {
    width: min(80vmin, 480px);
    aspect-ratio: 1 / 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6));
  }
</style>
</head>
<body>
  <div class="clock-wrap">
    <canvas id="clockCanvas"></canvas>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('clockCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        const size = canvas.clientWidth * (window.devicePixelRatio || 1);
        canvas.width = size;
        canvas.height = size;
      }

      function drawFace(radius) {
        // Bezel (outer rim)
        const bezelGradient = ctx.createLinearGradient(-radius, -radius, radius, radius);
        bezelGradient.addColorStop(0, '#5a5f68');
        bezelGradient.addColorStop(0.5, '#dcdfe4');
        bezelGradient.addColorStop(1, '#3a3d43');
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = bezelGradient;
        ctx.fill();

        // Face
        const faceRadius = radius * 0.92;
        const faceGradient = ctx.createRadialGradient(
          -faceRadius * 0.3, -faceRadius * 0.3, faceRadius * 0.1,
          0, 0, faceRadius
        );
        faceGradient.addColorStop(0, '#fbfbfa');
        faceGradient.addColorStop(1, '#e4e4e0');
        ctx.beginPath();
        ctx.arc(0, 0, faceRadius, 0, Math.PI * 2);
        ctx.fillStyle = faceGradient;
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = radius * 0.05;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function drawTicksAndNumerals(radius) {
        const faceRadius = radius * 0.92;

        for (let i = 0; i < 60; i++) {
          const angle = (i / 60) * Math.PI * 2;
          const isHour = i % 5 === 0;
          if (isHour) continue; // draw hour ticks separately, skip overlapping minute tick

          const inner = faceRadius * 0.90;
          const outer = faceRadius * 0.96;
          drawTick(angle, inner, outer, faceRadius * 0.006, '#8a8a86');
        }

        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const inner = faceRadius * 0.82;
          const outer = faceRadius * 0.96;
          drawTick(angle, inner, outer, faceRadius * 0.02, '#26262a');
        }

        ctx.font = `${faceRadius * 0.16}px -apple-system, sans-serif`;
        ctx.fillStyle = '#26262a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let n = 1; n <= 12; n++) {
          const angle = (n / 12) * Math.PI * 2 - Math.PI / 2;
          const numRadius = faceRadius * 0.68;
          const x = Math.cos(angle) * numRadius;
          const y = Math.sin(angle) * numRadius;
          ctx.fillText(String(n), x, y);
        }
      }

      function drawTick(angle, innerR, outerR, width, color) {
        const a = angle - Math.PI / 2;
        const x1 = Math.cos(a) * innerR;
        const y1 = Math.sin(a) * innerR;
        const x2 = Math.cos(a) * outerR;
        const y2 = Math.sin(a) * outerR;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      function drawHand(angle, length, tailLength, width, color) {
        const a = angle - Math.PI / 2;
        const tipX = Math.cos(a) * length;
        const tipY = Math.sin(a) * length;
        const tailX = Math.cos(a + Math.PI) * tailLength;
        const tailY = Math.sin(a + Math.PI) * tailLength;

        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(tipX, tipY);
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      function drawCenterCap(radius) {
        const capGradient = ctx.createRadialGradient(0, -radius * 0.01, 0, 0, 0, radius * 0.035);
        capGradient.addColorStop(0, '#4a4a4a');
        capGradient.addColorStop(1, '#161616');
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.03, 0, Math.PI * 2);
        ctx.fillStyle = capGradient;
        ctx.fill();
      }

      function render() {
        const size = canvas.width;
        const radius = size / 2;

        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.translate(radius, radius);

        drawFace(radius * 0.98);
        drawTicksAndNumerals(radius * 0.98);

        const now = new Date();
        const ms = now.getMilliseconds();
        const seconds = now.getSeconds() + ms / 1000;
        const minutes = now.getMinutes() + seconds / 60;
        const hours = (now.getHours() % 12) + minutes / 60;

        const faceRadius = radius * 0.98 * 0.92;

        const hourAngle = (hours / 12) * Math.PI * 2;
        const minuteAngle = (minutes / 60) * Math.PI * 2;
        const secondAngle = (seconds / 60) * Math.PI * 2;

        drawHand(hourAngle, faceRadius * 0.5, faceRadius * 0.08, faceRadius * 0.045, '#26262a');
        drawHand(minuteAngle, faceRadius * 0.72, faceRadius * 0.10, faceRadius * 0.03, '#26262a');
        drawHand(secondAngle, faceRadius * 0.80, faceRadius * 0.14, faceRadius * 0.01, '#c0392b');

        drawCenterCap(faceRadius);

        ctx.restore();
      }

      function loop() {
        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      resize();
      loop();
    })();
  </script>
</body>
</html>
