<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>

    <style>
        /* Global body styling to center the clock */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            font-family: sans-serif;
        }

        /* The main clock face container */
        .clock {
            width: 360px; /* Diameter of the clock */
            height: 360px;
            border: 15px solid #333;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            position: relative; /* Needed to position the hands */
            background: #fff;
        }

        /* Styling for the center pivot point */
        .clock::before {
            content: '';
            width: 40px;
            height: 40px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Ensure it sits on top of the hands */
        }

        /* General hand styling */
        .hand {
            position: absolute;
            top: calc(50% - var(--length)); /* Start at the center, offset by half length */
            left: calc(50% - var(--width) / 2); /* Center horizontally */
            border-radius: 3px;
            transform-origin: bottom center; /* Rotation pivot point is the bottom edge */
        }

        /* Specific hand styles using CSS variables for easier calculation/styling */
        #hour {
            width: 6px;
            height: calc(var(--length) - 20px); /* Length minus clock center size */
            background-color: #333;
            transform: rotate(0deg);
            z-index: 5;
        }

        #minute {
            width: 4px;
            height: calc(var(--length) - 20px);
            background-color: #666;
            transform: rotate(0deg);
            z-index: 10;
        }

        #second {
            width: 2px;
            height: calc(var(--length) - 20px);
            background-color: red;
            transform: rotate(0deg);
            z-index: 20; /* Highest z-index */
        }

    </style>
</head>
<body>

    <div class="clock">
        <!-- The Hands -->
        <div id="hour" class="hand"></div>
        <div id="minute" class="hand"></div>
        <div id="second" class="hand"></div>
    </div>

    <script>
        // Set the CSS variables for hand dimensions (using 360px clock size)
        document.getElementById('hour').style.setProperty('--length', '250px');
        document.getElementById('minute').style.setProperty('--length', '270px');
        document.getElementById('second').style.setProperty('--length', '280px');

        // Set the CSS variables for hand widths (using 360px clock size)
        document.getElementById('hour').style.setProperty('--width', '6px');
        document.getElementById('minute').style.setProperty('--width', '4px');
        document.getElementById('second').style.setProperty('--width', '2px');


        function updateClock() {
            const now = new Date();

            // Get time components
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            /*
             * Calculation Logic:
             * 1. Full circle is 360 degrees.
             * 2. Second Hand: (seconds / 60) * 360 -> Since seconds are already out of 60, this simplifies to (s * 6).
             * 3. Minute Hand: ((minutes + seconds/60) / 60) * 360 -> Simplified: ((m * 60 + s) / 60) * 6 = m * 6 + s * 0.1
             *    A simpler way: (m / 60 * 360) + (s / 60 * 6) => m * 6 + s * 0.1 degrees
             * 4. Hour Hand: ((hours % 12) / 12) * 360 -> Since hours wrap at 12, we use modulo 12. The minutes drag it slightly.
             *    Simplified: (h % 12 / 12 * 360) + (m / 60 * 30) => h * 30 + m * 0.5 degrees
            */

            // Calculate Rotations in Degrees
            const secondsDegrees = ((seconds / 60) * 360);
            const minutesDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hoursDegrees = ((hours % 12 / 12) * 360) + ((minutes / 60) * 30);

            // Apply rotations using CSS transform property
            document.getElementById('second').style.transform = `rotate(${secondsDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minutesDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hoursDegrees}deg)`;
        }

        // Update the clock immediately, and then every 50 milliseconds for smooth animation
        updateClock();
        setInterval(updateClock, 50); 
    </script>
</body>
</html>
