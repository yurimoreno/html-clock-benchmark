<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Clock</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 25%, #1e2531 0%, #0a0c11 70%);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  .clock-wrap {
    width: min(82vmin, 520px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 40px 70px -25px rgba(0,0,0,.95),
      0 10px 30px -10px rgba(0,0,0,.7);
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="clock-wrap">
  <canvas id="clock"></canvas>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("clock");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, R = 0, cx = 0, cy = 0;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W, H) / 2;
    cx = W / 2;
    cy = H / 2;
  }

  /* ---------- static parts of the dial ---------- */
  function drawDial() {
    ctx.clearRect(0, 0, W, H);

    /* face */
    var faceGrad = ctx.createRadialGradient(
      cx - R * 0.32, cy - R * 0.38, R * 0.05,
      cx, cy, R * 1.02
    );
    faceGrad.addColorStop(0, "#ffffff");
    faceGrad.addColorStop(0.58, "#f6f3e9");
    faceGrad.addColorStop(1, "#ddd6c2");

    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.97, 0, Math.PI * 2);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    /* bezel */
    ctx.lineWidth = R * 0.045;
    ctx.strokeStyle = "#242a35";
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.975, 0, Math.PI * 2);
    ctx.stroke();

    /* inner hairline */
    ctx.lineWidth = Math.max(1, R * 0.0035);
    ctx.strokeStyle = "rgba(60, 50, 35, 0.22)";
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.80, 0, Math.PI * 2);
    ctx.stroke();

    /* tick marks */
    ctx.lineCap = "round";
    for (var i = 0; i < 60; i++) {
      var a = (i / 60) * Math.PI * 2 - Math.PI / 2;
      var isHour = (i % 5 === 0);
      var outer = R * 0.905;
      var inner = outer - (isHour ? R * 0.085 : R * 0.042);

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
      ctx.lineWidth = isHour ? R * 0.020 : R * 0.0065;
      ctx.strokeStyle = isHour ? "#2b3240" : "rgba(70, 80, 95, 0.55)";
      ctx.stroke();
    }

    /* numerals */
    ctx.font = "600 " + (R * 0.145) + "px Georgia, 'Times New Roman', serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#232935";

    for (var n = 1; n <= 12; n++) {
      var ang = (n / 12) * Math.PI * 2 - Math.PI / 2;
      var rr = R * 0.685;
      ctx.fillText(String(n), cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr);
    }

    /* subtle glass reflection */
    var gloss = ctx.createLinearGradient(
      cx - R, cy - R, cx + R * 0.4, cy + R * 0.7
    );
    gloss.addColorStop(0, "rgba(255,255,255,0.55)");
    gloss.addColorStop(0.42, "rgba(255,255,255,0.06)");
    gloss.addColorStop(1, "rgba(255,255,255,0)");

    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.952, 0, Math.PI * 2);
    ctx.fillStyle = gloss;
    ctx.fill();
  }

  /* ---------- one hand ---------- */
  function drawHand(angle, length, width, color, tail) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    ctx.shadowColor = "rgba(18, 20, 30, 0.30)";
    ctx.shadowBlur = R * 0.035;
    ctx.shadowOffsetX = R * 0.012;
    ctx.shadowOffsetY = R * 0.018;

    ctx.beginPath();
    ctx.moveTo(0, tail);
    ctx.lineTo(0, -length);
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.restore();
  }

  /* ---------- frame ---------- */
  function draw() {
    var now = new Date();
    var sec = now.getSeconds() + now.getMilliseconds() / 1000;
    var min = now.getMinutes() + sec / 60;
    var hr  = (now.getHours() % 12) + min / 60;

    drawDial();

    /* hour hand */
    drawHand(hr * Math.PI / 6, R * 0.50, R * 0.046, "#1f2530", R * 0.065);

    /* minute hand */
    drawHand(min * Math.PI / 30, R * 0.72, R * 0.030, "#1f2530", R * 0.085);

    /* second hand */
    drawHand(sec * Math.PI / 30, R * 0.82, R * 0.011, "#c62828", R * 0.22);

    /* small counterweight on the second hand */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(sec * Math.PI / 30);
    ctx.beginPath();
    ctx.arc(0, R * 0.15, R * 0.026, 0, Math.PI * 2);
    ctx.fillStyle = "#c62828";
    ctx.fill();
    ctx.restore();

    /* center cap */
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.038, 0, Math.PI * 2);
    ctx.fillStyle = "#1f2530";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.014, 0, Math.PI * 2);
    ctx.fillStyle = "#e8e2d2";
    ctx.fill();

    requestAnimationFrame(draw);
  }

  /* ---------- boot ---------- */
  resize();

  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(canvas);
  } else {
    window.addEventListener("resize", resize);
  }

  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
