<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #2c3e50, #1a252f);
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .clock {
    position: relative;
    box-sizing: content-box;      /* keep coordinates relative to the 320px face */
    width: 320px;
    height: 320px;
    border: 12px solid #34495e;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #e6e6e6);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.08);
  }

  .number {
    position: absolute;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    color: #2c3e50;
    transform: translate(-50%, -50%);
  }

  .tick {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 8px;
    margin-left: -1px;
    background: #b2bec3;
    transform-origin: 50% 160px;  /* rotate around the clock's center */
  }
  .tick.major {
    width: 4px;
    height: 14px;
    margin-left: -2px;
    background: #2c3e50;
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: 50% 100%;  /* pivot at the clock's center */
    border-radius: 4px;
    will-change: transform;
  }
  .hour-hand {
    width: 8px;
    height: 85px;
    margin-left: -4px;
    background: #2c3e50;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
  }
  .minute-hand {
    width: 5px;
    height: 120px;
    margin-left: -2.5px;
    background: #2c3e50;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
  }
  .second-hand {
    width: 2px;
    height: 135px;
    margin-left: -1px;
    background: #e74c3c;
  }
  .second-hand::after {          /* counterweight tail */
    content: '';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 18px;
    background: #e74c3c;
  }

  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #e74c3c;
    border: 3px solid #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="clock" id="clock"></div>

<script>
  const clock = document.getElementById('clock');
  const RADIUS = 160; // half the clock face size (320px / 2)

  // Build 60 tick marks (every 5th one is "major")
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(tick);
  }

  // Place the numbers 1–12 around the dial
  for (let i = 1; i <= 12; i++) {
    const num = document.createElement('div');
    num.className = 'number';
    num.textContent = i;
    const angle = (i * 30 - 90) * Math.PI / 180;
    const r = RADIUS - 42;
    num.style.left = (RADIUS + Math.cos(angle) * r) + 'px';
    num.style.top  = (RADIUS + Math.sin(angle) * r) + 'px';
    clock.appendChild(num);
  }

  // Create the hands and center cap
  const hourHand   = document.createElement('div');
  const minuteHand = document.createElement('div');
  const secondHand = document.createElement('div');
  hourHand.className   = 'hand hour-hand';
  minuteHand.className = 'hand minute-hand';
  secondHand.className = 'hand second-hand';
  const dot = document.createElement('div');
  dot.className = 'center-dot';
  clock.append(hourHand, minuteHand, secondHand, dot);

  function updateClock() {
    const now = new Date();
    // Include milliseconds for a smooth, sweeping motion
    const s = now.getSeconds() + now.getMilliseconds() / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    secondHand.style.transform = `rotate(${s * 6}deg)`;   // 360° / 60 s
    minuteHand.style.transform = `rotate(${m * 6}deg)`;   // 360° / 60 min
    hourHand.style.transform   = `rotate(${h * 30}deg)`;  // 360° / 12 h

    requestAnimationFrame(updateClock);
  }

  updateClock();
</script>

</body>
</html>
