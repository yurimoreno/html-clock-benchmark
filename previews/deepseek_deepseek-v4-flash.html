<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog Clock</title>
    <style>
        /* ── reset & page ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1a1e2c, #2d3349);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        /* ── clock card ── */
        .clock-wrapper {
            background: #1f2438;
            border-radius: 50%;
            padding: 18px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 2px 4px rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.2s;
        }

        .clock-wrapper:hover {
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.7),
                inset 0 2px 4px rgba(255, 255, 255, 0.08);
        }

        /* ── canvas ── */
        #clockCanvas {
            display: block;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: #fef9f0;
            box-shadow:
                inset 0 4px 30px rgba(0, 0, 0, 0.15),
                0 0 0 2px #3a4058;
            cursor: default;
            max-width: 100%;
            height: auto;
            aspect-ratio: 1/1;
        }

        /* ── responsive ── */
        @media (max-width: 500px) {
            .clock-wrapper {
                padding: 12px;
            }
            #clockCanvas {
                width: 300px;
            }
        }

        @media (max-width: 360px) {
            #clockCanvas {
                width: 240px;
            }
        }
    </style>
</head>
<body>

    <div class="clock-wrapper">
        <canvas id="clockCanvas" width="800" height="800"></canvas>
    </div>

    <script>
        (function() {
            "use strict";

            const canvas = document.getElementById('clockCanvas');
            const ctx = canvas.getContext('2d');

            // ─── dimensions ───
            const SIZE = 800;
            const CENTER = SIZE / 2;
            const RADIUS = 370;
            const TICK_LONG = 28;
            const TICK_SHORT = 14;

            // ─── colours ───
            const COLORS = {
                face: '#fef9f0',
                rim: '#2d3349',
                ticks: '#2d3349',
                hourHand: '#1f2438',
                minuteHand: '#2d3349',
                secondHand: '#d1404a',
                centerDot: '#2d3349',
                centerDotInner: '#fef9f0',
                brand: '#8e94a8',
            };

            // ─── draw the clock ───
            function drawClock() {
                const now = new Date();
                const hours = now.getHours() % 12;
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const millis = now.getMilliseconds();

                // ── smooth second hand (optional: smooth sweep) ──
                const smoothSeconds = seconds + millis / 1000;
                // smooth minute hand (slight movement from seconds)
                const smoothMinutes = minutes + smoothSeconds / 60;
                // smooth hour hand
                const smoothHours = hours + smoothMinutes / 60;

                // angles (clockwise from 12 o'clock)
                const hourAngle = (smoothHours / 12) * 2 * Math.PI - Math.PI / 2;
                const minuteAngle = (smoothMinutes / 60) * 2 * Math.PI - Math.PI / 2;
                const secondAngle = (smoothSeconds / 60) * 2 * Math.PI - Math.PI / 2;

                // ── clear ──
                ctx.clearRect(0, 0, SIZE, SIZE);

                // ── face ──
                ctx.save();

                // subtle drop shadow behind the face (already done via CSS, but extra polish)
                ctx.shadowColor = 'rgba(0,0,0,0.05)';
                ctx.shadowBlur = 30;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;

                // face circle
                ctx.beginPath();
                ctx.arc(CENTER, CENTER, RADIUS, 0, 2 * Math.PI);
                ctx.fillStyle = COLORS.face;
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                // subtle inner ring
                ctx.beginPath();
                ctx.arc(CENTER, CENTER, RADIUS - 6, 0, 2 * Math.PI);
                ctx.strokeStyle = '#e8e0d4';
                ctx.lineWidth = 2;
                ctx.stroke();

                // ── tick marks ──
                for (let i = 0; i < 60; i++) {
                    const angle = (i / 60) * 2 * Math.PI - Math.PI / 2;
                    const isHour = i % 5 === 0;
                    const length = isHour ? TICK_LONG : TICK_SHORT;
                    const width = isHour ? 5 : 2.4;

                    const outerX = CENTER + Math.cos(angle) * (RADIUS - 22);
                    const outerY = CENTER + Math.sin(angle) * (RADIUS - 22);
                    const innerX = CENTER + Math.cos(angle) * (RADIUS - 22 - length);
                    const innerY = CENTER + Math.sin(angle) * (RADIUS - 22 - length);

                    ctx.beginPath();
                    ctx.moveTo(outerX, outerY);
                    ctx.lineTo(innerX, innerY);
                    ctx.strokeStyle = COLORS.ticks;
                    ctx.lineWidth = width;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // ── hour numbers (optional subtle text) ──
                ctx.font = '500 38px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = '#2d3349';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let i = 1; i <= 12; i++) {
                    const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
                    const dist = RADIUS - 66;
                    const x = CENTER + Math.cos(angle) * dist;
                    const y = CENTER + Math.sin(angle) * dist;
                    ctx.fillText(i.toString(), x, y);
                }

                // ── brand text ──
                ctx.font = '300 16px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = COLORS.brand;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏰ clock', CENTER, CENTER + 120);

                // ── hour hand ──
                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(hourAngle);

                // thicker, tapered shape
                ctx.beginPath();
                ctx.moveTo(-12, 24);
                ctx.quadraticCurveTo(-14, -20, -6, -140);
                ctx.lineTo(6, -140);
                ctx.quadraticCurveTo(14, -20, 12, 24);
                ctx.closePath();
                ctx.fillStyle = COLORS.hourHand;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.fill();

                // highlight line on hour hand
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(0, -130);
                ctx.lineTo(0, 20);
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();

                // ── minute hand ──
                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(minuteAngle);

                ctx.beginPath();
                ctx.moveTo(-10, 28);
                ctx.quadraticCurveTo(-12, -24, -5, -204);
                ctx.lineTo(5, -204);
                ctx.quadraticCurveTo(12, -24, 10, 28);
                ctx.closePath();
                ctx.fillStyle = COLORS.minuteHand;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(0, -194);
                ctx.lineTo(0, 24);
                ctx.strokeStyle = 'rgba(255,255,255,0.10)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();

                // ── second hand ──
                ctx.save();
                ctx.translate(CENTER, CENTER);
                ctx.rotate(secondAngle);

                // long thin hand with counterweight
                ctx.beginPath();
                ctx.moveTo(-3, 40);
                ctx.lineTo(3, 40);
                ctx.lineTo(2.2, -224);
                ctx.lineTo(-2.2, -224);
                ctx.closePath();
                ctx.fillStyle = COLORS.secondHand;
                ctx.shadowColor = 'rgba(209, 64, 74, 0.35)';
                ctx.shadowBlur = 22;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 2;
                ctx.fill();

                // small circle counterweight
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(0, 32, 5.5, 0, 2 * Math.PI);
                ctx.fillStyle = COLORS.secondHand;
                ctx.fill();

                // tip dot
                ctx.beginPath();
                ctx.arc(0, -220, 4, 0, 2 * Math.PI);
                ctx.fillStyle = COLORS.secondHand;
                ctx.shadowColor = 'rgba(209, 64, 74, 0.3)';
                ctx.shadowBlur = 14;
                ctx.fill();

                ctx.restore();

                // ── center cap ──
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 14;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 2;
                ctx.beginPath();
                ctx.arc(CENTER, CENTER, 18, 0, 2 * Math.PI);
                ctx.fillStyle = COLORS.centerDot;
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(CENTER, CENTER, 12, 0, 2 * Math.PI);
                ctx.fillStyle = COLORS.centerDotInner;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(CENTER, CENTER, 5, 0, 2 * Math.PI);
                ctx.fillStyle = COLORS.centerDot;
                ctx.fill();

                ctx.restore();

                // ── decorative rim ring (CSS does outer, this is inner accent) ──
                ctx.beginPath();
                ctx.arc(CENTER, CENTER, RADIUS - 2, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(45, 51, 73, 0.25)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // ── request next frame ──
                requestAnimationFrame(drawClock);
            }

            // ─── start ───
            drawClock();
        })();
    </script>

</body>
</html>
