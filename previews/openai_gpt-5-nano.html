<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analog Clock</title>
  <style>
    :root {
      --bg: #0e0f14;
      --face: #ffffff;
      --tick-dark: #111;
      --tick-light: #888;
      --hour: #333;
      --minute: #555;
      --second: #e60000;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #1a1f28 0%, #0b0f15 60%, #0b0f15 100%);
      font-family: system-ui, Arial, sans-serif;
      color: #fff;
    }

    .clock-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
    }

    /* Make the clock responsive on small screens */
    svg {
      width: 90vmin;
      height: auto;
      max-width: 520px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.3));
      display: block;
      background: #fff;
      border-radius: 12px;
    }

    /* Optional: add a subtle inner shading for the clock face */
    .face {
      fill: #ffffff;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <svg id="clock" viewBox="0 0 400 400" aria-label="Analog clock" role="img">
      <!-- Clock face -->
      <circle cx="200" cy="200" r="180" fill="#ffffff" stroke="#333" stroke-width="2"></circle>

      <!-- Tick marks will be generated by JavaScript -->
      <g id="ticks"></g>

      <!-- Hands (lines anchored at center, rotated around center) -->
      <line id="hour"   x1="200" y1="200" x2="200" y2="120" stroke="#333" stroke-width="6" stroke-linecap="round"></line>
      <line id="minute" x1="200" y1="200" x2="200" y2="80"  stroke="#555" stroke-width="4" stroke-linecap="round"></line>
      <line id="second" x1="200" y1="200" x2="200" y2="60"  stroke="#e60000" stroke-width="2" stroke-linecap="round"></line>

      <!-- Central hub -->
      <circle cx="200" cy="200" r="5" fill="#333"></circle>
    </svg>
  </div>

  <script>
    (function () {
      const svgNS = "http://www.w3.org/2000/svg";
      const clockSvg = document.getElementById('clock');
      const ticksGroup = document.getElementById('ticks');
      const hourHand = document.getElementById('hour');
      const minuteHand = document.getElementById('minute');
      const secondHand = document.getElementById('second');
      const cx = 200, cy = 200;

      // Generate the 60 tick marks around the clock
      // Outer radius where ticks end
      const rOut = 170;
      for (let i = 0; i < 60; i++) {
        const angleRad = (i * 6 - 90) * Math.PI / 180; // -90 to start at 12 o'clock
        const isMajor = (i % 5 === 0);
        const rIn = isMajor ? 110 : 145; // major ticks longer (closer to center)
        const x1 = cx + Math.cos(angleRad) * rIn;
        const y1 = cy + Math.sin(angleRad) * rIn;
        const x2 = cx + Math.cos(angleRad) * rOut;
        const y2 = cy + Math.sin(angleRad) * rOut;

        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', isMajor ? '#000' : '#888');
        line.setAttribute('stroke-width', isMajor ? '3' : '1.5');
        line.setAttribute('stroke-linecap', 'round');
        ticksGroup.appendChild(line);
      }

      // Update the clock hands to the current time
      function updateClock() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds() + ms / 1000;          // seconds with fractional part
        const m = now.getMinutes() + s / 60;             // minutes with seconds contribution
        const h = (now.getHours() % 12) + m / 60;        // hours with minutes contribution

        const secAngle = s * 6;       // 360/60
        const minAngle = m * 6;
        const hourAngle = h * 30;       // 360/12

        // Rotate around the clock center (200, 200)
        hourHand.setAttribute('transform', `rotate(${hourAngle}  ${cx} ${cy})`);
        minuteHand.setAttribute('transform', `rotate(${minAngle} ${cx} ${cy})`);
        secondHand.setAttribute('transform', `rotate(${secAngle} ${cx} ${cy})`);
      }

      // Initialize and start animation
      updateClock();
      let raf = null;
      function tick() {
        updateClock();
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);

      // Clean up if the page unloads
      window.addEventListener('beforeunload', () => {
        if (raf) cancelAnimationFrame(raf);
      });
    })();
  </script>
</body>
</html>
