<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  .clock-wrapper {
    text-align: center;
  }
  .clock-wrapper h1 {
    color: rgba(255,255,255,0.7);
    margin-bottom: 20px;
    font-size: 1.4rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }
  svg {
    filter: drop-shadow(0 0 30px rgba(100, 100, 255, 0.3));
  }
  .digital-time {
    color: rgba(255,255,255,0.6);
    margin-top: 25px;
    font-size: 1.6rem;
    letter-spacing: 3px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div class="clock-wrapper">
  <h1>Analog Clock</h1>

  <svg id="clock" width="400" height="400" viewBox="0 0 400 400">
    <defs>
      <!-- Clock face gradient -->
      <radialGradient id="faceGradient" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#e8e8f0" />
      </radialGradient>
      <!-- Outer ring gradient -->
      <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c0c0d0" />
        <stop offset="50%" stop-color="#8888a0" />
        <stop offset="100%" stop-color="#555570" />
      </linearGradient>
      <!-- Center dot gradient -->
      <radialGradient id="centerDot" cx="40%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#ff6b6b" />
        <stop offset="100%" stop-color="#c0392b" />
      </radialGradient>
    </defs>

    <!-- Outer ring -->
    <circle cx="200" cy="200" r="196" fill="url(#ringGradient)" stroke="#666680" stroke-width="1"/>

    <!-- Inner ring detail -->
    <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Clock face -->
    <circle cx="200" cy="200" r="182" fill="url(#faceGradient)" stroke="#d0d0dd" stroke-width="2"/>

    <!-- Minute tick marks (generated by JS) -->
    <g id="minuteTicks"></g>

    <!-- Hour tick marks and numbers (generated by JS) -->
    <g id="hourTicks"></g>

    <!-- Hour numbers (generated by JS) -->
    <g id="hourNumbers"></g>

    <!-- Decorative inner circle -->
    <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>

    <!-- Hour hand -->
    <g id="hourHand">
      <line x1="200" y1="215" x2="200" y2="105"
            stroke="#2c3e50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Minute hand -->
    <g id="minuteHand">
      <line x1="200" y1="220" x2="200" y2="65"
            stroke="#2c3e50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Second hand -->
    <g id="secondHand">
      <line x1="200" y1="235" x2="200" y2="50"
            stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
      <circle cx="200" cy="235" r="4" fill="#e74c3c"/>
    </g>

    <!-- Center cap -->
    <circle cx="200" cy="200" r="12" fill="url(#centerDot)" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="5" fill="#fff" opacity="0.9"/>

    <!-- Glass reflection -->
    <ellipse cx="165" cy="140" rx="75" ry="55" fill="rgba(255,255,255,0.12)" transform="rotate(-25 165 140)"/>
  </svg>

  <div class="digital-time" id="digitalTime">00:00:00</div>
</div>

<script>
(function() {
  // Generate minute tick marks
  const minuteTicksGroup = document.getElementById('minuteTicks');
  const hourTicksGroup = document.getElementById('hourTicks');
  const hourNumbersGroup = document.getElementById('hourNumbers');
  const cx = 200, cy = 200;

  for (let i = 0; i < 60; i++) {
    const angle = (i * 6) * Math.PI / 180 - Math.PI / 2;
    const isHour = i % 5 === 0;

    if (isHour) continue; // skip hour marks here

    const outerR = 172;
    const innerR = 162;
    const x1 = cx + outerR * Math.cos(angle);
    const y1 = cy + outerR * Math.sin(angle);
    const x2 = cx + innerR * Math.cos(angle);
    const y2 = cy + innerR * Math.sin(angle);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#999');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-linecap', 'round');
    minuteTicksGroup.appendChild(line);
  }

  // Generate hour tick marks and numbers
  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30) * Math.PI / 180 - Math.PI / 2;

    // Hour tick (thick)
    const outerR = 178;
    const innerR = 155;
    const x1 = cx + outerR * Math.cos(angle);
    const y1 = cy + outerR * Math.sin(angle);
    const x2 = cx + innerR * Math.cos(angle);
    const y2 = cy + innerR * Math.sin(angle);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#2c3e50');
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    hourTicksGroup.appendChild(line);

    // Hour number
    const numR = 135;
    const nx = cx + numR * Math.cos(angle);
    const ny = cy + numR * Math.sin(angle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', nx);
    text.setAttribute('y', ny);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('fill', '#2c3e50');
    text.setAttribute('font-size', '24');
    text.setAttribute('font-family', 'Georgia, serif');
    text.setAttribute('font-weight', 'bold');
    text.textContent = i;
    hourNumbersGroup.appendChild(text);
  }

  // Clock update function
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const digitalTime = document.getElementById('digitalTime');

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    // Smooth second hand
    const secAngle = (s + ms / 1000) * 6;
    // Smooth minute hand
    const minAngle = (m + s / 60) * 6;
    // Smooth hour hand
    const hourAngle = (h % 12 + m / 60 + s / 3600) * 30;

    hourHand.setAttribute('transform', `rotate(${hourAngle} 200 200)`);
    minuteHand.setAttribute('transform', `rotate(${minAngle} 200 200)`);
    secondHand.setAttribute('transform', `rotate(${secAngle} 200 200)`);

    // Digital display
    const hh = String(h).padStart(2, '0');
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    digitalTime.textContent = `${hh}:${mm}:${ss}`;

    requestAnimationFrame(updateClock);
  }

  updateClock();
})();
</script>

</body>
</html>
