<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Analog Clock</title>
    <style>
        /* Base reset and setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f141d;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Times New Roman', Times, serif;
        }

        /* Scaler to ensure the clock is responsive */
        .clock-scaler {
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        @media (max-width: 420px) {
            .clock-scaler {
                transform: scale(0.8);
            }
        }

        @media (max-width: 340px) {
            .clock-scaler {
                transform: scale(0.65);
            }
        }

        /* Gold metallic bezel */
        .clock-bezel {
            padding: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5d77f 0%, #b8860b 40%, #e5c060 60%, #7d5c00 100%);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6), 
                inset 0 2px 7px rgba(255, 255, 255, 0.5),
                inset 0 -2px 10px rgba(0, 0, 0, 0.6);
        }

        /* Deep-set clock face */
        .clock-face {
            position: relative;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, #1a2230 0%, #10151f 100%);
            border-radius: 50%;
            box-shadow: 
                inset 0 12px 24px rgba(0, 0, 0, 0.9), 
                inset 0 -8px 20px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* Number markings container */
        .number {
            --rotation: 0deg;
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            transform: rotate(var(--rotation));
            padding: 24px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ecd08c;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            user-select: none;
        }

        /* Keep numbers oriented upright */
        .number div {
            transform: rotate(calc(-1 * var(--rotation)));
        }

        /* Assign rotation variables for hours */
        .n1  { --rotation: 30deg; }
        .n2  { --rotation: 60deg; }
        .n3  { --rotation: 90deg; }
        .n4  { --rotation: 120deg; }
        .n5  { --rotation: 150deg; }
        .n6  { --rotation: 180deg; }
        .n7  { --rotation: 210deg; }
        .n8  { --rotation: 240deg; }
        .n9  { --rotation: 270deg; }
        .n10 { --rotation: 300deg; }
        .n11 { --rotation: 330deg; }
        .n12 { --rotation: 0deg; }

        /* Shared Hands configuration */
        .hand {
            position: absolute;
            left: 50%;
            border-radius: 10px;
            will-change: transform;
        }

        /* Hour Hand */
        .hand.hour {
            width: 8px;
            height: 95px;
            top: calc(50% - 75px);      /* Extends 75px up, tail extends 20px down */
            left: calc(50% - 4px);
            background: linear-gradient(to bottom, #f3d17a, #bd9233);
            transform-origin: 50% 75px; /* Pivot point matching center */
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            z-index: 5;
        }

        /* Minute Hand */
        .hand.minute {
            width: 5px;
            height: 140px;
            top: calc(50% - 118px);     /* Extends 118px up, tail extends 22px down */
            left: calc(50% - 2.5px);
            background: linear-gradient(to bottom, #f9df99, #9a731c);
            transform-origin: 50% 118px;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.4));
            z-index: 6;
        }

        /* Second Hand (Sleek red sweep) */
        .hand.second {
            width: 2px;
            height: 160px;
            top: calc(50% - 130px);     /* Extends 130px up, tail extends 30px down */
            left: calc(50% - 1px);
            background: #ff4d4d;
            transform-origin: 50% 130px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
            z-index: 7;
        }

        /* Center Axis Pins */
        .center-pin-outer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #f3d078 0%, #b8860b 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            border: 2px solid #10151f;
        }

        .center-pin-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #ff4d4d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
        }
    </style>
</head>
<body>

    <div class="clock-scaler">
        <div class="clock-bezel">
            <div class="clock-face">
                
                <!-- Hour numbers 1 to 12 -->
                <div class="number n1"><div>I</div></div>
                <div class="number n2"><div>II</div></div>
                <div class="number n3"><div>III</div></div>
                <div class="number n4"><div>IV</div></div>
                <div class="number n5"><div>V</div></div>
                <div class="number n6"><div>VI</div></div>
                <div class="number n7"><div>VII</div></div>
                <div class="number n8"><div>VIII</div></div>
                <div class="number n9"><div>IX</div></div>
                <div class="number n10"><div>X</div></div>
                <div class="number n11"><div>XI</div></div>
                <div class="number n12"><div>XII</div></div>

                <!-- Clock Hands -->
                <div class="hand hour" id="hour"></div>
                <div class="hand minute" id="minute"></div>
                <div class="hand second" id="second"></div>

                <!-- Center Caps -->
                <div class="center-pin-outer"></div>
                <div class="center-pin-inner"></div>

            </div>
        </div>
    </div>

    <script>
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClock() {
            const now = new Date();
            
            // Get current components including milliseconds
            const ms = now.getMilliseconds();
            const secs = now.getSeconds() + (ms / 1000);
            const mins = now.getMinutes() + (secs / 60);
            const hrs = (now.getHours() % 12) + (mins / 60);

            // Calculate rotation values
            const secDeg = secs * 6; // 360 degrees / 60 seconds
            const minDeg = mins * 6; // 360 degrees / 60 minutes
            const hrDeg = hrs * 30;  // 360 degrees / 12 hours

            // Apply rotations instantly for smooth sweep movement
            secondHand.style.transform = `rotate(${secDeg}deg)`;
            minuteHand.style.transform = `rotate(${minDeg}deg)`;
            hourHand.style.transform = `rotate(${hrDeg}deg)`;

            // Loop inside screen redraw cycles
            requestAnimationFrame(updateClock);
        }

        // Start the continuous rendering clock
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
