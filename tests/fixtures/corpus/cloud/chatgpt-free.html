<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    .clock {
      width: 320px;
      height: 320px;
      border: 10px solid #f9fafb;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, #1f2937 0%, #111827 100%);
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      color: #f9fafb;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .number span {
      display: inline-block;
      transform: translateY(12px);
    }

    .number1  { transform: rotate(30deg); }
    .number1 span  { transform: rotate(-30deg) translateY(12px); }

    .number2  { transform: rotate(60deg); }
    .number2 span  { transform: rotate(-60deg) translateY(12px); }

    .number3  { transform: rotate(90deg); }
    .number3 span  { transform: rotate(-90deg) translateY(12px); }

    .number4  { transform: rotate(120deg); }
    .number4 span  { transform: rotate(-120deg) translateY(12px); }

    .number5  { transform: rotate(150deg); }
    .number5 span  { transform: rotate(-150deg) translateY(12px); }

    .number6  { transform: rotate(180deg); }
    .number6 span  { transform: rotate(-180deg) translateY(12px); }

    .number7  { transform: rotate(210deg); }
    .number7 span  { transform: rotate(-210deg) translateY(12px); }

    .number8  { transform: rotate(240deg); }
    .number8 span  { transform: rotate(-240deg) translateY(12px); }

    .number9  { transform: rotate(270deg); }
    .number9 span  { transform: rotate(-270deg) translateY(12px); }

    .number10 { transform: rotate(300deg); }
    .number10 span { transform: rotate(-300deg) translateY(12px); }

    .number11 { transform: rotate(330deg); }
    .number11 span { transform: rotate(-330deg) translateY(12px); }

    .number12 span { transform: translateY(12px); }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 10px;
    }

    .hour {
      width: 8px;
      height: 80px;
      background: #f9fafb;
      z-index: 3;
    }

    .minute {
      width: 5px;
      height: 110px;
      background: #d1d5db;
      z-index: 2;
    }

    .second {
      width: 2px;
      height: 130px;
      background: #ef4444;
      z-index: 4;
    }

    .center {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #f9fafb;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    .tick {
      position: absolute;
      width: 4px;
      height: 14px;
      background: #9ca3af;
      top: 4px;
      left: 50%;
      transform-origin: 50% 156px;
    }

    .tick.major {
      height: 20px;
      width: 5px;
      background: #f9fafb;
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">
    <!-- Ticks -->
    <script>
      for (let i = 0; i < 60; i++) {
        const tick = document.createElement("div");
        tick.classList.add("tick");
        if (i % 5 === 0) tick.classList.add("major");
        tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
        document.currentScript.parentElement.appendChild(tick);
      }
    </script>

    <!-- Numbers -->
    <div class="number number1"><span>1</span></div>
    <div class="number number2"><span>2</span></div>
    <div class="number number3"><span>3</span></div>
    <div class="number number4"><span>4</span></div>
    <div class="number number5"><span>5</span></div>
    <div class="number number6"><span>6</span></div>
    <div class="number number7"><span>7</span></div>
    <div class="number number8"><span>8</span></div>
    <div class="number number9"><span>9</span></div>
    <div class="number number10"><span>10</span></div>
    <div class="number number11"><span>11</span></div>
    <div class="number number12"><span>12</span></div>

    <!-- Hands -->
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>

    <!-- Center Dot -->
    <div class="center"></div>
  </div>

  <script>
    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");

    function updateClock() {
      const now = new Date();

      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondDeg = seconds * 6;
      const minuteDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = (hours % 12) * 30 + minutes * 0.5;

      secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
