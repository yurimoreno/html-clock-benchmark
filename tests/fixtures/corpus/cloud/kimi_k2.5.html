<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .clock-container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .clock {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a4a, #1a1a2e);
            box-shadow:
                0 0 50px rgba(0, 150, 255, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            border: 4px solid #3a3a5a;
        }

        .clock::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #00d4ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #e0e0e0;
            padding-top: 15px;
        }

        .number span {
            display: inline-block;
            transform-origin: center bottom;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background: #888;
            left: 50%;
            top: 5px;
            transform-origin: center 145px;
            margin-left: -1px;
        }

        .tick.major {
            width: 4px;
            height: 15px;
            background: #00d4ff;
            margin-left: -2px;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            transition: transform 0.05s cubic-bezier(0.4, 2.3, 0.6, 1);
        }

        .hour-hand {
            width: 6px;
            height: 70px;
            background: linear-gradient(to top, #fff, #ccc);
            margin-left: -3px;
            z-index: 3;
        }

        .minute-hand {
            width: 4px;
            height: 100px;
            background: linear-gradient(to top, #00d4ff, #0099cc);
            margin-left: -2px;
            z-index: 2;
        }

        .second-hand {
            width: 2px;
            height: 120px;
            background: linear-gradient(to top, #ff4757, #ff6b7a);
            margin-left: -1px;
            z-index: 1;
        }

        .second-hand::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 4px;
            height: 25px;
            background: #ff4757;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .digital-time {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #888;
            letter-spacing: 2px;
        }

        .brand {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="clock">
            <!-- Hour numbers -->
            <div class="number" style="transform: rotate(0deg);"><span style="transform: rotate(0deg);">12</span></div>
            <div class="number" style="transform: rotate(30deg);"><span style="transform: rotate(-30deg);">1</span></div>
            <div class="number" style="transform: rotate(60deg);"><span style="transform: rotate(-60deg);">2</span></div>
            <div class="number" style="transform: rotate(90deg);"><span style="transform: rotate(-90deg);">3</span></div>
            <div class="number" style="transform: rotate(120deg);"><span style="transform: rotate(-120deg);">4</span></div>
            <div class="number" style="transform: rotate(150deg);"><span style="transform: rotate(-150deg);">5</span></div>
            <div class="number" style="transform: rotate(180deg);"><span style="transform: rotate(-180deg);">6</span></div>
            <div class="number" style="transform: rotate(210deg);"><span style="transform: rotate(-210deg);">7</span></div>
            <div class="number" style="transform: rotate(240deg);"><span style="transform: rotate(-240deg);">8</span></div>
            <div class="number" style="transform: rotate(270deg);"><span style="transform: rotate(-270deg);">9</span></div>
            <div class="number" style="transform: rotate(300deg);"><span style="transform: rotate(-300deg);">10</span></div>
            <div class="number" style="transform: rotate(330deg);"><span style="transform: rotate(-330deg);">11</span></div>

            <!-- Tick marks -->
            <div class="tick major" style="transform: rotate(0deg);"></div>
            <div class="tick" style="transform: rotate(6deg);"></div>
            <div class="tick" style="transform: rotate(12deg);"></div>
            <div class="tick" style="transform: rotate(18deg);"></div>
            <div class="tick" style="transform: rotate(24deg);"></div>
            <div class="tick major" style="transform: rotate(30deg);"></div>
            <div class="tick" style="transform: rotate(36deg);"></div>
            <div class="tick" style="transform: rotate(42deg);"></div>
            <div class="tick" style="transform: rotate(48deg);"></div>
            <div class="tick" style="transform: rotate(54deg);"></div>
            <div class="tick major" style="transform: rotate(60deg);"></div>
            <div class="tick" style="transform: rotate(66deg);"></div>
            <div class="tick" style="transform: rotate(72deg);"></div>
            <div class="tick" style="transform: rotate(78deg);"></div>
            <div class="tick" style="transform: rotate(84deg);"></div>
            <div class="tick major" style="transform: rotate(90deg);"></div>
            <div class="tick" style="transform: rotate(96deg);"></div>
            <div class="tick" style="transform: rotate(102deg);"></div>
            <div class="tick" style="transform: rotate(108deg);"></div>
            <div class="tick" style="transform: rotate(114deg);"></div>
            <div class="tick major" style="transform: rotate(120deg);"></div>
            <div class="tick" style="transform: rotate(126deg);"></div>
            <div class="tick" style="transform: rotate(132deg);"></div>
            <div class="tick" style="transform: rotate(138deg);"></div>
            <div class="tick" style="transform: rotate(144deg);"></div>
            <div class="tick major" style="transform: rotate(150deg);"></div>
            <div class="tick" style="transform: rotate(156deg);"></div>
            <div class="tick" style="transform: rotate(162deg);"></div>
            <div class="tick" style="transform: rotate(168deg);"></div>
            <div class="tick" style="transform: rotate(174deg);"></div>
            <div class="tick major" style="transform: rotate(180deg);"></div>
            <div class="tick" style="transform: rotate(186deg);"></div>
            <div class="tick" style="transform: rotate(192deg);"></div>
            <div class="tick" style="transform: rotate(198deg);"></div>
            <div class="tick" style="transform: rotate(204deg);"></div>
            <div class="tick major" style="transform: rotate(210deg);"></div>
            <div class="tick" style="transform: rotate(216deg);"></div>
            <div class="tick" style="transform: rotate(222deg);"></div>
            <div class="tick" style="transform: rotate(228deg);"></div>
            <div class="tick" style="transform: rotate(234deg);"></div>
            <div class="tick major" style="transform: rotate(240deg);"></div>
            <div class="tick" style="transform: rotate(246deg);"></div>
            <div class="tick" style="transform: rotate(252deg);"></div>
            <div class="tick" style="transform: rotate(258deg);"></div>
            <div class="tick" style="transform: rotate(264deg);"></div>
            <div class="tick major" style="transform: rotate(270deg);"></div>
            <div class="tick" style="transform: rotate(276deg);"></div>
            <div class="tick" style="transform: rotate(282deg);"></div>
            <div class="tick" style="transform: rotate(288deg);"></div>
            <div class="tick" style="transform: rotate(294deg);"></div>
            <div class="tick major" style="transform: rotate(300deg);"></div>
            <div class="tick" style="transform: rotate(306deg);"></div>
            <div class="tick" style="transform: rotate(312deg);"></div>
            <div class="tick" style="transform: rotate(318deg);"></div>
            <div class="tick" style="transform: rotate(324deg);"></div>
            <div class="tick major" style="transform: rotate(330deg);"></div>
            <div class="tick" style="transform: rotate(336deg);"></div>
            <div class="tick" style="transform: rotate(342deg);"></div>
            <div class="tick" style="transform: rotate(348deg);"></div>
            <div class="tick" style="transform: rotate(354deg);"></div>

            <!-- Hands -->
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>

            <div class="brand">Analog</div>
            <div class="digital-time" id="digitalTime"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Calculate rotation angles
            // Hour hand: moves 30 degrees per hour + 0.5 degrees per minute
            const hourDegrees = ((hours % 12) * 30) + (minutes * 0.5);

            // Minute hand: moves 6 degrees per minute + 0.1 degrees per second
            const minuteDegrees = (minutes * 6) + (seconds * 0.1);

            // Second hand: moves 6 degrees per second + smooth movement
            const secondDegrees = (seconds * 6) + (milliseconds * 0.006);

            // Apply rotations
            document.getElementById('hourHand').style.transform = `rotate(${hourDegrees}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('secondHand').style.transform = `rotate(${secondDegrees}deg)`;

            // Update digital display
            const timeString = now.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('digitalTime').textContent = timeString;
        }

        // Update clock immediately and then every 50ms for smooth second hand
        updateClock();
        setInterval(updateClock, 50);
    </script>
</body>
</html>
