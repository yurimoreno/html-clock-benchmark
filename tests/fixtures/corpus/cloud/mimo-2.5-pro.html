<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
  }
  .clock {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: #16213e;
    border: 8px solid #e94560;
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.3), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .clock-face {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .number {
    position: absolute;
    font-size: 22px;
    font-weight: bold;
    color: #eee;
    text-align: center;
    width: 30px;
    height: 30px;
    line-height: 30px;
  }
  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
    z-index: 10;
  }
  .hour-hand {
    width: 6px;
    height: 70px;
    background: #eee;
    margin-left: -3px;
    border-radius: 4px 4px 0 0;
  }
  .minute-hand {
    width: 4px;
    height: 95px;
    background: #ccc;
    margin-left: -2px;
    border-radius: 3px 3px 0 0;
  }
  .second-hand {
    width: 2px;
    height: 110px;
    background: #e94560;
    margin-left: -1px;
    border-radius: 2px 2px 0 0;
  }
  .center-dot {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #e94560;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
  }
  .tick {
    position: absolute;
    width: 2px;
    height: 10px;
    background: #888;
    top: 10px;
    left: 50%;
    transform-origin: center 150px;
    margin-left: -1px;
  }
  .tick.major {
    height: 16px;
    width: 3px;
    background: #eee;
    margin-left: -1.5px;
  }
</style>
</head>
<body>

<div class="clock">
  <div class="clock-face" id="clockFace">
    <div class="hand hour-hand" id="hourHand"></div>
    <div class="hand minute-hand" id="minuteHand"></div>
    <div class="hand second-hand" id="secondHand"></div>
    <div class="center-dot"></div>
  </div>
</div>

<script>
  const face = document.getElementById('clockFace');

  // Add tick marks
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg)`;
    face.appendChild(tick);
  }

  // Add numbers
  for (let i = 1; i <= 12; i++) {
    const num = document.createElement('div');
    num.className = 'number';
    num.textContent = i;
    const angle = (i * 30) * Math.PI / 180;
    const radius = 120;
    const x = 160 + radius * Math.sin(angle) - 15;
    const y = 160 - radius * Math.cos(angle) - 15;
    num.style.left = x + 'px';
    num.style.top = y + 'px';
    face.appendChild(num);
  }

  function updateClock() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secDeg = (s + ms / 1000) * 6;
    const minDeg = (m + s / 60) * 6;
    const hourDeg = (h + m / 60) * 30;

    document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
    document.getElementById('minuteHand').style.transform = `rotate(${minDeg}deg)`;
    document.getElementById('secondHand').style.transform = `rotate(${secDeg}deg)`;

    requestAnimationFrame(updateClock);
  }

  updateClock();
</script>

</body>
</html>
