<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .clock {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #16213e 60%, #0f3460 100%);
    border: 8px solid #e94560;
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  .clock-face {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
    z-index: 2;
    transition: transform 0.05s cubic-bezier(0.4, 2.3, 0.6, 1);
  }

  .hand.hour {
    width: 8px;
    height: 70px;
    background: #fff;
    margin-left: -4px;
  }

  .hand.minute {
    width: 6px;
    height: 100px;
    background: #00d9ff;
    margin-left: -3px;
  }

  .hand.second {
    width: 2px;
    height: 120px;
    background: #e94560;
    margin-left: -1px;
    transition: transform 0.02s cubic-bezier(0.4, 2.3, 0.6, 1);
  }

  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    background: #e94560;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
  }

  .tick {
    position: absolute;
    width: 2px;
    height: 10px;
    background: rgba(255,255,255,0.3);
    left: 50%;
    top: 0;
    transform-origin: 50% 150px;
    margin-left: -1px;
  }

  .tick.major {
    width: 4px;
    height: 16px;
    background: rgba(255,255,255,0.8);
    margin-left: -2px;
  }

  .tick-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    font-size: 18px;
    font-weight: bold;
    color: rgba(255,255,255,0.9);
  }
</style>
</head>
<body>

<div class="clock">
  <div class="clock-face" id="clockFace">
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
    <div class="center-dot"></div>
  </div>
</div>

<script>
  const clockFace = document.getElementById('clockFace');

  // Create ticks and numbers
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg)`;
    clockFace.appendChild(tick);
  }

  for (let i = 1; i <= 12; i++) {
    const label = document.createElement('div');
    label.className = 'tick-label';
    label.textContent = i;
    const angle = i * 30 * Math.PI / 180;
    const radius = 120;
    const x = Math.sin(angle) * radius;
    const y = -Math.cos(angle) * radius;
    label.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    clockFace.appendChild(label);
  }

  function updateClock() {
    const now = new Date();
    const seconds = now.getSeconds();
    const minutes = now.getMinutes();
    const hours = now.getHours();

    const secondDeg = (seconds / 60) * 360;
    const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
    const hourDeg = ((hours % 12 + minutes / 60) / 12) * 360;

    document.getElementById('secondHand').style.transform = `rotate(${secondDeg}deg)`;
    document.getElementById('minuteHand').style.transform = `rotate(${minuteDeg}deg)`;
    document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
