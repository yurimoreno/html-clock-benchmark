<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f0f0f0;
    font-family: Arial, Helvetica, sans-serif;
  }

  .clock {
    position: relative;
    width: 300px;
    height: 300px;
    border: 12px solid #333;
    border-radius: 50%;
    background: #fff;
    box-shadow:
      0 0 0 4px #fff,
      inset 0 0 0 3px #333,
      0 0 20px rgba(0,0,0,.1);
  }

  .clock::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 12px; height: 12px;
    background: #333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }

  .hand {
    position: absolute;
    width: 50%;
    height: 4px;
    background: #333;
    top: 50%;
    left: 50%;
    transform-origin: 0% 50%;
    transform: rotate(90deg);
    border-radius: 2px;
  }

  .hand.hour   { width: 35%; height: 8px; background:#222; }
  .hand.minute { width: 45%; height: 6px; background:#555; }
  .hand.second { width: 48%; height: 2px; background:#c33; }

  .numbers {
    position: absolute;
    width: 100%; height: 100%;
    top: 0; left: 0;
    pointer-events: none;
    font-size: 1.2rem;
    display: flex;
    flex-wrap: wrap;
    align-content: space-around;
    justify-content: space-around;
    padding: 12px;
    box-sizing: border-box;
  }

  .numbers div {
    width: 20%;
    text-align: center;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="clock">
  <div class="numbers">
    <div>12</div><div>1</div><div>2</div><div>3</div><div>4</div>
    <div>5</div><div>6</div><div>7</div><div>8</div><div>9</div>
    <div>10</div><div>11</div>
  </div>

  <div class="hand hour"   id="hour-hand"></div>
  <div class="hand minute" id="minute-hand"></div>
  <div class="hand second" id="second-hand"></div>
</div>

<script>
  const hourHand   = document.getElementById('hour-hand');
  const minuteHand = document.getElementById('minute-hand');
  const secondHand = document.getElementById('second-hand');

  function setClock() {
    const now = new Date();

    const seconds = now.getSeconds();
    const minutes = now.getMinutes();
    const hours   = now.getHours() % 12;

    // Angles: 360deg per full rotation
    const secondDeg = ((seconds / 60) * 360);
    const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
    const hourDeg   = ((hours + minutes / 60 + seconds / 3600) / 12) * 360;

    secondHand.style.transform = `rotate(${secondDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    hourHand.style.transform   = `rotate(${hourDeg}deg)`;
  }

  // Initial placement
  setClock();

  // Update each second
  setInterval(setClock, 1000);
</script>

</body>
</html>
