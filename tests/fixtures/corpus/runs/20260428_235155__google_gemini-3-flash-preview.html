<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .clock {
            width: 300px;
            height: 300px;
            background: #ecf0f1;
            border: 15px solid #34495e;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Center dot */
        .clock::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #2c3e50;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }

        .hour {
            width: 8px;
            height: 60px;
            background: #000;
            margin-left: -4px;
        }

        .minute {
            width: 6px;
            height: 90px;
            background: #555;
            margin-left: -3px;
        }

        .second {
            width: 2px;
            height: 110px;
            background: #e74c3c;
            margin-left: -1px;
            transition: none; /* Smooth sweep or ticking */
        }

        /* Number markings */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="clock">
        <!-- Markings -->
        <div class="number" style="transform: rotate(30deg)">|</div>
        <div class="number" style="transform: rotate(60deg)">|</div>
        <div class="number" style="transform: rotate(90deg)">3</div>
        <div class="number" style="transform: rotate(120deg)">|</div>
        <div class="number" style="transform: rotate(150deg)">|</div>
        <div class="number" style="transform: rotate(180deg)">6</div>
        <div class="number" style="transform: rotate(210deg)">|</div>
        <div class="number" style="transform: rotate(240deg)">|</div>
        <div class="number" style="transform: rotate(270deg)">9</div>
        <div class="number" style="transform: rotate(300deg)">|</div>
        <div class="number" style="transform: rotate(330deg)">|</div>
        <div class="number" style="transform: rotate(0deg)">12</div>

        <!-- Hands -->
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="min-hand"></div>
        <div class="hand second" id="sec-hand"></div>
    </div>

    <script>
        const hourHand = document.getElementById('hour-hand');
        const minHand = document.getElementById('min-hand');
        const secHand = document.getElementById('sec-hand');

        function setClock() {
            const now = new Date();

            const seconds = now.getSeconds();
            const secDegrees = (seconds / 60) * 360;
            secHand.style.transform = `rotate(${secDegrees}deg)`;

            const minutes = now.getMinutes();
            const minDegrees = ((minutes / 60) * 360) + ((seconds/60)*6);
            minHand.style.transform = `rotate(${minDegrees}deg)`;

            const hours = now.getHours();
            const hourDegrees = ((hours / 12) * 360) + ((minutes/60)*30);
            hourHand.style.transform = `rotate(${hourDegrees}deg)`;
        }

        // Run clock every second
        setInterval(setClock, 1000);

        // Initial call to prevent 1s delay on load
        setClock();
    </script>
</body>
</html>
