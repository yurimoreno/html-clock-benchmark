<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .clock-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        canvas {
            filter: drop-shadow(0 0 30px rgba(100, 140, 255, 0.15));
        }

        .digital-time {
            color: rgba(180, 200, 255, 0.7);
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <canvas id="clock" width="500" height="500"></canvas>
        <div class="digital-time" id="digital"></div>
    </div>

    <script>
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');
        const digitalEl = document.getElementById('digital');
        const center = canvas.width / 2;
        const radius = canvas.width / 2 - 30;

        function drawClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const millis = now.getMilliseconds();

            const smoothSeconds = seconds + millis / 1000;
            const smoothMinutes = minutes + smoothSeconds / 60;
            const smoothHours = hours + smoothMinutes / 60;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Outer ring glow
            const glowGrad = ctx.createRadialGradient(center, center, radius - 5, center, center, radius + 15);
            glowGrad.addColorStop(0, 'rgba(100, 150, 255, 0.1)');
            glowGrad.addColorStop(1, 'rgba(100, 150, 255, 0)');
            ctx.beginPath();
            ctx.arc(center, center, radius + 15, 0, Math.PI * 2);
            ctx.fillStyle = glowGrad;
            ctx.fill();

            // Clock face background
            const faceGrad = ctx.createRadialGradient(center, center - 40, 10, center, center, radius);
            faceGrad.addColorStop(0, '#1e2040');
            faceGrad.addColorStop(0.7, '#151730');
            faceGrad.addColorStop(1, '#0d0f20');
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.fillStyle = faceGrad;
            ctx.fill();

            // Inner bezel
            ctx.beginPath();
            ctx.arc(center, center, radius - 2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100, 140, 220, 0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(center, center, radius - 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100, 140, 220, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Minute ticks
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6 - 90) * (Math.PI / 180);
                const isHour = i % 5 === 0;
                const outerR = radius - 18;
                const innerR = isHour ? radius - 40 : radius - 28;

                const x1 = center + Math.cos(angle) * outerR;
                const y1 = center + Math.sin(angle) * outerR;
                const x2 = center + Math.cos(angle) * innerR;
                const y2 = center + Math.sin(angle) * innerR;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = isHour
                    ? 'rgba(200, 210, 255, 0.9)'
                    : 'rgba(140, 155, 200, 0.35)';
                ctx.lineWidth = isHour ? 3 : 1;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // Hour numbers
            ctx.font = 'bold 28px Georgia';
            ctx.fillStyle = 'rgba(200, 210, 255, 0.85)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const numR = radius - 62;
                const x = center + Math.cos(angle) * numR;
                const y = center + Math.sin(angle) * numR;
                ctx.fillText(i.toString(), x, y);
            }

            // Draw hands
            // Hour hand
            drawHand(smoothHours * 30 - 90, radius * 0.5, 7, 'rgba(220, 225, 255, 0.95)', 'rgba(180, 190, 240, 0.3)');
            // Minute hand
            drawHand(smoothMinutes * 6 - 90, radius * 0.72, 5, 'rgba(180, 195, 255, 0.95)', 'rgba(140, 160, 220, 0.3)');
            // Second hand
            drawSecondHand(smoothSeconds * 6 - 90);

            // Center cap
            const capGrad = ctx.createRadialGradient(center, center, 0, center, center, 12);
            capGrad.addColorStop(0, '#ffffff');
            capGrad.addColorStop(0.5, '#a0b0e0');
            capGrad.addColorStop(1, '#506090');
            ctx.beginPath();
            ctx.arc(center, center, 8, 0, Math.PI * 2);
            ctx.fillStyle = capGrad;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(center, center, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#1a1a2e';
            ctx.fill();

            // Digital time display
            const pad = (n) => n.toString().padStart(2, '0');
            digitalEl.textContent = `${pad(now.getHours())}:${pad(minutes)}:${pad(seconds)}`;

            requestAnimationFrame(drawClock);
        }

        function drawHand(angleDeg, length, width, color, shadowColor) {
            const angle = angleDeg * (Math.PI / 180);
            const endX = center + Math.cos(angle) * length;
            const endY = center + Math.sin(angle) * length;

            // Shadow
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = shadowColor;
            ctx.lineWidth = width + 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Hand
            const grad = ctx.createLinearGradient(center, center, endX, endY);
            grad.addColorStop(0, color);
            grad.addColorStop(1, shadowColor);
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = grad;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function drawSecondHand(angleDeg) {
            const angle = angleDeg * (Math.PI / 180);
            const length = radius * 0.82;
            const tailLength = 40;

            const endX = center + Math.cos(angle) * length;
            const endY = center + Math.sin(angle) * length;
            const tailX = center - Math.cos(angle) * tailLength;
            const tailY = center - Math.sin(angle) * tailLength;

            // Glow
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'rgba(255, 80, 80, 0.15)';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Tail
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(tailX, tailY);
            ctx.strokeStyle = 'rgba(255, 90, 90, 0.7)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Main hand
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = '#ff4040';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Tip dot
            ctx.beginPath();
            ctx.arc(endX, endY, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4040';
            ctx.fill();
        }

        drawClock();
    </script>
</body>
</html>
