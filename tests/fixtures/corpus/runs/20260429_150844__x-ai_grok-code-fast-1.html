<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .clock {
            width: 300px;
            height: 300px;
            position: relative;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .hour-marks {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .hour-mark {
            position: absolute;
            width: 4px;
            height: 15px;
            background: black;
            top: 10px;
            left: 50%;
            margin-left: -2px;
        }
        .number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: black;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
        }
        .hour-hand {
            width: 6px;
            height: 80px;
            background: black;
        }
        .minute-hand {
            width: 4px;
            height: 100px;
            background: black;
        }
        .second-hand {
            width: 2px;
            height: 120px;
            background: red;
        }
        .center {
            position: absolute;
            width: 12px;
            height: 12px;
            background: black;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="clock">
        <div class="center"></div>
        <!-- Hour marks -->
        <div class="hour-marks">
            <div class="hour-mark" style="transform: rotate(0deg);"></div>
            <div class="hour-mark" style="transform: rotate(30deg);"></div>
            <div class="hour-mark" style="transform: rotate(60deg);"></div>
            <div class="hour-mark" style="transform: rotate(90deg);"></div>
            <div class="hour-mark" style="transform: rotate(120deg);"></div>
            <div class="hour-mark" style="transform: rotate(150deg);"></div>
            <div class="hour-mark" style="transform: rotate(180deg);"></div>
            <div class="hour-mark" style="transform: rotate(210deg);"></div>
            <div class="hour-mark" style="transform: rotate(240deg);"></div>
            <div class="hour-mark" style="transform: rotate(270deg);"></div>
            <div class="hour-mark" style="transform: rotate(300deg);"></div>
            <div class="hour-mark" style="transform: rotate(330deg);"></div>
        </div>
        <!-- Numbers -->
        <div class="number" style="top: 30px; left: 50%; transform: translateX(-50%);">12</div>
        <div class="number" style="top: 50%; right: 30px; transform: translateY(-50%);">3</div>
        <div class="number" style="bottom: 30px; left: 50%; transform: translateX(-50%);">6</div>
        <div class="number" style="top: 50%; left: 30px; transform: translateY(-50%);">9</div>
        <!-- Hands -->
        <div class="hand hour-hand" id="hour"></div>
        <div class="hand minute-hand" id="minute"></div>
        <div class="hand second-hand" id="second"></div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Calculate rotations
            const hourDeg = (hours % 12) * 30 + minutes * 0.5;
            const minuteDeg = minutes * 6 + seconds * 0.1;
            const secondDeg = seconds * 6;

            // Apply rotations
            document.getElementById('hour').style.transform = `rotate(${hourDeg}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDeg}deg)`;
            document.getElementById('second').style.transform = `rotate(${secondDeg}deg)`;
        }

        // Update clock every second
        setInterval(updateClock, 1000);
        updateClock(); // Initial call
    </script>
</body>
</html>
