<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .clock {
            width: 300px;
            height: 300px;
            background-color: #ecf0f1;
            border: 10px solid #34495e;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* The center dot */
        .clock::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #2c3e50;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 10;
        }

        /* Hour markers */
        .marker {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 5px;
            box-sizing: border-box;
            color: #34495e;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            transform: translateX(-50%) rotate(0deg);
        }

        .hour-hand {
            width: 6px;
            height: 70px;
            background-color: #2c3e50;
            z-index: 3;
        }

        .minute-hand {
            width: 4px;
            height: 110px;
            background-color: #34495e;
            z-index: 4;
        }

        .second-hand {
            width: 2px;
            height: 130px;
            background-color: #e74c3c;
            z-index: 5;
        }

        /* Adding number markings via simple CSS positioning */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            font-size: 1.5rem;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="clock">
        <!-- Numbers -->
        <div class="number" style="transform: rotate(30deg)"><div style="transform: rotate(-30deg)">1</div></div>
        <div class="number" style="transform: rotate(60deg)"><div style="transform: rotate(-60deg)">2</div></div>
        <div class="number" style="transform: rotate(90deg)"><div style="transform: rotate(-90deg)">3</div></div>
        <div class="number" style="transform: rotate(120deg)"><div style="transform: rotate(-120deg)">4</div></div>
        <div class="number" style="transform: rotate(150deg)"><div style="transform: rotate(-150deg)">5</div></div>
        <div class="number" style="transform: rotate(180deg)"><div style="transform: rotate(-180deg)">6</div></div>
        <div class="number" style="transform: rotate(210deg)"><div style="transform: rotate(-210deg)">7</div></div>
        <div class="number" style="transform: rotate(240deg)"><div style="transform: rotate(-240deg)">8</div></div>
        <div class="number" style="transform: rotate(270deg)"><div style="transform: rotate(-270deg)">9</div></div>
        <div class="number" style="transform: rotate(300deg)"><div style="transform: rotate(-300deg)">10</div></div>
        <div class="number" style="transform: rotate(330deg)"><div style="transform: rotate(-330deg)">11</div></div>
        <div class="number" style="transform: rotate(0deg)"><div style="transform: rotate(0deg)">12</div></div>

        <!-- Hands -->
        <div class="hand hour-hand" id="hour"></div>
        <div class="hand minute-hand" id="minute"></div>
        <div class="hand second-hand" id="second"></div>
    </div>

    <script>
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClock() {
            const now = new Date();

            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Calculate rotation degrees
            // Seconds: 360 / 60 = 6 degrees per second
            const secondsDegrees = (seconds * 6);
            
            // Minutes: 6 degrees per minute + fractional movement based on seconds
            const minutesDegrees = (minutes * 6) + (seconds / 10);
            
            // Hours: 360 / 12 = 30 degrees per hour + fractional movement based on minutes
            const hoursDegrees = (hours % 12 * 30) + (minutes / 2);

            secondHand.style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
        }

        // Run the clock every second
        setInterval(updateClock, 1000);

        // Run immediately on load
        updateClock();
    </script>
</body>
</html>
