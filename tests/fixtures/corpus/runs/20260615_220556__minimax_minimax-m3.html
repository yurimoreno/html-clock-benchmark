<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 30% 30%, #2a3441, #0f1419);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .clock {
    --size: 320px;
    position: relative;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #f5f5f0 0%, #e8e6dd 70%, #d4d2c8 100%);
    box-shadow:
      0 0 0 8px #1a1f26,
      0 0 0 10px #3a4148,
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 0 30px rgba(0, 0, 0, 0.05);
  }

  /* Hour markers */
  .clock::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }

  .marker {
    position: absolute;
    inset: 0;
    text-align: center;
    color: #1a1f26;
    font-weight: 600;
    padding-top: 12px;
    font-size: 22px;
  }

  .marker.tick {
    padding-top: 0;
  }

  .marker.tick::after {
    content: "";
    display: block;
    width: 2px;
    height: 10px;
    background: #1a1f26;
    margin: 6px auto 0;
    border-radius: 1px;
  }

  .marker.major {
    font-size: 24px;
    font-weight: 700;
  }

  .marker.major::after {
    display: none;
  }

  /* Clock hands */
  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    z-index: 2;
  }

  .hour {
    width: 6px;
    height: 28%;
    margin-left: -3px;
    background: linear-gradient(to top, #1a1f26 0%, #1a1f26 70%, #2a3441 100%);
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  .minute {
    width: 4px;
    height: 38%;
    margin-left: -2px;
    background: linear-gradient(to top, #1a1f26 0%, #1a1f26 80%, #2a3441 100%);
    box-shadow: 0 0 3px rgba(0,0,0,0.3);
  }

  .second {
    width: 2px;
    height: 42%;
    margin-left: -1px;
    background: #c0392b;
    box-shadow: 0 0 2px rgba(192, 57, 43, 0.4);
  }

  /* Counterweight on second hand */
  .second::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -20%;
    transform: translateX(-50%);
    width: 8px;
    height: 18%;
    background: #c0392b;
    border-radius: 50%;
  }

  /* Center cap */
  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    background: #1a1f26;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    box-shadow: inset 0 0 3px rgba(255,255,255,0.2);
  }

  .center::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: #c0392b;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* Digital display */
  .digital {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #1a1f26;
    font-weight: 600;
    letter-spacing: 1px;
    font-family: "Courier New", monospace;
  }
</style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="hand hour"  id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
    <div class="center"></div>
    <div class="digital" id="digital"></div>
  </div>

<script>
  // Create hour markers (1 through 12)
  const clock = document.getElementById('clock');
  for (let i = 1; i <= 12; i++) {
    const marker = document.createElement('div');
    marker.className = 'marker' + (i % 3 === 0 ? ' major' : ' tick');
    marker.textContent = i % 3 === 0 ? i : '';
    marker.style.transform = `rotate(${i * 30}deg)`;
    // Counter-rotate the text on major markers so numbers stay upright
    if (i % 3 === 0) {
      const num = document.createElement('span');
      num.textContent = i;
      num.style.display = 'inline-block';
      num.style.transform = `rotate(-${i * 30}deg)`;
      marker.textContent = '';
      marker.appendChild(num);
    }
    clock.appendChild(marker);
  }

  const hourHand   = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const digital    = document.getElementById('digital');

  function update() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    // Smooth second hand (sweeping motion)
    const secondDeg = (s + ms / 1000) * 6;
    const minuteDeg = (m + s / 60) * 6;
    const hourDeg   = (h + m / 60 + s / 3600) * 30;

    secondHand.style.transform = `rotate(${secondDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    hourHand.style.transform   = `rotate(${hourDeg}deg)`;

    // Digital display
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    digital.textContent = `${hh}:${mm}:${ss}`;
  }

  // Initial render + smooth animation using requestAnimationFrame
  update();
  setInterval(update, 50);
</script>
</body>
</html>
