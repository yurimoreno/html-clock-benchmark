<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
    body{
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
        margin:0;
        background:#f0f0f0;
        font-family:sans-serif;
    }
    .clock{
        position:relative;
        width:300px;
        height:300px;
        border:12px solid #333;
        border-radius:50%;
        background:#fff;
        box-shadow:0 0 15px rgba(0,0,0,.2);
    }
    .clock::after{
        content:"";
        position:absolute;
        top:50%; left:50%;
        width:12px; height:12px;
        background:#333;
        border-radius:50%;
        transform:translate(-50%,-50%);
        z-index:10;
    }
    .hand{
        position:absolute;
        bottom:50%;
        left:50%;
        transform-origin:bottom center;
        background:#333;
    }
    .hour{
        width:8px;
        height:70px;
        margin-left:-4px;
        background:#222;
        border-radius:4px;
    }
    .minute{
        width:6px;
        height:100px;
        margin-left:-3px;
        background:#555;
        border-radius:3px;
    }
    .second{
        width:2px;
        height:120px;
        margin-left:-1px;
        background:#e33;
        border-radius:1px;
    }
    .ticks{
        position:absolute;
        width:100%; height:100%;
        top:0; left:0;
        pointer-events:none;
    }
    .tick{
        position:absolute;
        width:2px;
        height:12px;
        background:#000;
        top:0; left:50%;
        transform-origin:center bottom;
    }
    .tick.long{
        height:20px;
        width:3px;
        background:#000;
    }
</style>
</head>
<body>

<div class="clock">
    <div class="ticks"></div>

    <div class="hand hour"   id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
</div>

<script>
    // ---- create hour marks (ticks) -----------------------------------------
    const ticksContainer = document.querySelector('.ticks');
    for (let i = 0; i < 60; i++) {
        const tick = document.createElement('div');
        tick.classList.add('tick');
        if (i % 5 === 0) tick.classList.add('long');          // longer tick each 5 mins
        tick.style.transform = `rotate(${i * 6}deg) translateY(-140px)`;
        ticksContainer.appendChild(tick);
    }

    const hourHand   = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');

    function updateClock() {
        const now = new Date();

        const seconds = now.getSeconds() + now.getMilliseconds()/1000;
        const minutes = now.getMinutes() + seconds/60;
        const hours   = now.getHours() % 12 + minutes/60;

        const degSecond = seconds * 6;          // 360° / 60
        const degMinute = minutes * 6;          // 360° / 60
        const degHour   = hours   * 30;          // 360° / 12

        secondHand.style.transform = `rotate(${degSecond}deg) translate(-50%,0)`;
        minuteHand.style.transform = `rotate(${degMinute}deg) translate(-50%,0)`;
        hourHand.style.transform   = `rotate(${degHour}deg)   translate(-50%,0)`;
    }

    // Update every 40 ms for smooth seconds hand
    setInterval(updateClock, 40);
    updateClock(); // initialise instantly
</script>

</body>
</html>
