<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: sans-serif;
        }

        .clock {
            width: 300px;
            height: 300px;
            border: 15px solid #333;
            border-radius: 50%;
            position: relative;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .center-dot {
            width: 20px;
            height: 20px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0% 0%; /* Rotate from the base of the hand */
            transform: translate(-50%, -100%) rotate(0deg); /* Adjust for hand origin and initial position */
            background-color: #333;
            border-radius: 5px;
        }

        .hour-hand {
            width: 6px;
            height: 80px;
            background-color: #333;
        }

        .minute-hand {
            width: 4px;
            height: 120px;
            background-color: #555;
        }

        .second-hand {
            width: 2px;
            height: 130px;
            background-color: #e74c3c;
            /* Pointier end for second hand */
        }

        /* Number markings */
        .clock::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(transparent 90%, black 90%) 0 0 / 100% 100%,
                radial-gradient(transparent 90%, black 90%) 0 0 / 100% 100%,
                /* Hour marks (larger) */
                linear-gradient(0deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 12 */
                linear-gradient(30deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 1 */
                linear-gradient(60deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 2 */
                linear-gradient(90deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 3 */
                linear-gradient(120deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 4 */
                linear-gradient(150deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 5 */
                linear-gradient(180deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 6 */
                linear-gradient(210deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 7 */
                linear-gradient(240deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 8 */
                linear-gradient(270deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 9 */
                linear-gradient(300deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 10 */
                linear-gradient(330deg, transparent 48%, #333 48%, #333 52%, transparent 52%) 50% 0 / 2px 10px no-repeat, /* 11 */


                /* Minute marks (smaller) - simplified approach for minute marks */
                repeating-conic-gradient(from 0deg, #ccc 0deg 1deg, transparent 1deg 6deg); /* 60 small marks */
            background-repeat: no-repeat;
            background-position: center center;
            z-index: 1; /* Below the hands */
        }
    </style>
</head>
<body>
    <div class="clock">
        <div class="center-dot"></div>
        <div class="hand hour-hand" id="hour"></div>
        <div class="hand minute-hand" id="minute"></div>
        <div class="hand second-hand" id="second"></div>
    </div>

    <script>
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Calculate degrees for each hand
            // Hour hand: 360 degrees in 12 hours. Plus 30 degrees per hour, and 0.5 degrees per minute.
            const hourDegrees = ((hours % 12) + minutes / 60) * 30;
            // Minute hand: 360 degrees in 60 minutes. Plus 6 degrees per minute, and 0.1 degrees per second.
            const minuteDegrees = (minutes + seconds / 60) * 6;
            // Second hand: 360 degrees in 60 seconds. 6 degrees per second.
            const secondDegrees = seconds * 6;

            // Apply rotations
            hourHand.style.transform = `translate(-50%, -100%) rotate(${hourDegrees}deg)`;
            minuteHand.style.transform = `translate(-50%, -100%) rotate(${minuteDegrees}deg)`;
            secondHand.style.transform = `translate(-50%, -100%) rotate(${secondDegrees}deg)`;
        }

        // Update the clock every second
        setInterval(updateClock, 1000);

        // Initial update to set the clock immediately
        updateClock();
    </script>
</body>
</html>
