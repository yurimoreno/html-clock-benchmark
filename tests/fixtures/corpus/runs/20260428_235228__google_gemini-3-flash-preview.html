<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .clock {
            width: 300px;
            height: 300px;
            background-color: #ecf0f1;
            border: 10px solid #34495e;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* The center dot */
        .clock::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #2c3e50;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            transform: translateX(-50%) rotate(0deg);
        }

        .hour {
            width: 8px;
            height: 60px;
            background-color: #2c3e50;
            z-index: 3;
        }

        .minute {
            width: 5px;
            height: 90px;
            background-color: #7f8c8d;
            z-index: 4;
        }

        .second {
            width: 2px;
            height: 110px;
            background-color: #e74c3c;
            z-index: 5;
        }

        /* Numbers */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 10px;
            box-sizing: border-box;
            color: #2c3e50;
        }

        .n1 { transform: rotate(30deg); }
        .n2 { transform: rotate(60deg); }
        .n3 { transform: rotate(90deg); }
        .n4 { transform: rotate(120deg); }
        .n5 { transform: rotate(150deg); }
        .n6 { transform: rotate(180deg); }
        .n7 { transform: rotate(210deg); }
        .n8 { transform: rotate(240deg); }
        .n9 { transform: rotate(270deg); }
        .n10 { transform: rotate(300deg); }
        .n11 { transform: rotate(330deg); }

        /* Correction to make numbers sit upright */
        .number span {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="clock">
        <!-- Hour Markers -->
        <div class="number n1">1</div>
        <div class="number n2">2</div>
        <div class="number n3">3</div>
        <div class="number n4">4</div>
        <div class="number n5">5</div>
        <div class="number n6">6</div>
        <div class="number n7">7</div>
        <div class="number n8">8</div>
        <div class="number n9">9</div>
        <div class="number n10">10</div>
        <div class="number n11">11</div>
        <div class="number n12" style="position:absolute; width:100%; text-align:center; padding:10px; font-weight:bold; font-size:1.2rem;">12</div>

        <!-- Hands -->
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
    </div>

    <script>
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');

        function setClock() {
            const now = new Date();

            const seconds = now.getSeconds();
            const secondsDegrees = (seconds / 60) * 360;
            secondHand.style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;

            const minutes = now.getMinutes();
            const minutesDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            minuteHand.style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;

            const hours = now.getHours();
            const hoursDegrees = ((hours / 12) * 360) + ((minutes / 60) * 30);
            hourHand.style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
        }

        // Run clock every second
        setInterval(setClock, 1000);

        // Run immediately so there is no delay on load
        setClock();
    </script>
</body>
</html>
