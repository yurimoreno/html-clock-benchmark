<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 100%);
            font-family: 'Georgia', serif;
        }

        .clock-container {
            position: relative;
            width: 340px;
            height: 340px;
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #f8f8ff, #e0e0e8 50%, #c8c8d4 100%);
            box-shadow:
                0 0 0 8px #2a2a3e,
                0 0 0 12px #1a1a2e,
                0 0 0 16px rgba(42, 42, 62, 0.5),
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 2px 10px rgba(0, 0, 0, 0.15);
        }

        /* Clock numbers */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #2a2a3e;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .number span {
            display: inline-block;
            padding-top: 18px;
        }

        .number-12  { transform: rotate(0deg); }
        .number-1   { transform: rotate(30deg); }
        .number-2   { transform: rotate(60deg); }
        .number-3   { transform: rotate(90deg); }
        .number-4   { transform: rotate(120deg); }
        .number-5   { transform: rotate(150deg); }
        .number-6   { transform: rotate(180deg); }
        .number-7   { transform: rotate(210deg); }
        .number-8   { transform: rotate(240deg); }
        .number-9   { transform: rotate(270deg); }
        .number-10  { transform: rotate(300deg); }
        .number-11  { transform: rotate(330deg); }

        /* Minute tick marks */
        .tick-marks {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .tick {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .tick::before {
            content: '';
            display: block;
            width: 1.5px;
            height: 10px;
            background: #555;
            margin-left: -0.75px;
            margin-top: 4px;
            border-radius: 1px;
        }

        .tick.major::before {
            width: 2.5px;
            height: 16px;
            margin-left: -1.25px;
            margin-top: 4px;
            background: #2a2a3e;
        }

        /* Hands container */
        .hands {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            transition: none;
        }

        .hour-hand {
            width: 7px;
            height: 85px;
            margin-left: -3.5px;
            background: linear-gradient(to top, #1a1a2e, #3a3a5e);
            z-index: 3;
            border-radius: 4px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }

        .minute-hand {
            width: 5px;
            height: 115px;
            margin-left: -2.5px;
            background: linear-gradient(to top, #1a1a2e, #4a4a6e);
            z-index: 4;
            border-radius: 3px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }

        .second-hand {
            width: 2px;
            height: 130px;
            margin-left: -1px;
            background: linear-gradient(to top, #c0392b, #e74c3c);
            z-index: 5;
            border-radius: 2px;
            box-shadow: 1px 1px 4px rgba(192, 57, 43, 0.4);
        }

        .second-hand::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: #e74c3c;
            border-radius: 2px;
        }

        /* Center cap */
        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin-top: -8px;
            margin-left: -8px;
            background: radial-gradient(circle at 35% 35%, #e74c3c, #a93226);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
        }

        /* Digital display */
        .digital-time {
            position: absolute;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.5);
            padding: 3px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="clock-face">
            <!-- Tick marks generated by JS -->
            <div class="tick-marks" id="tickMarks"></div>

            <!-- Numbers -->
            <div class="number number-12"><span>12</span></div>
            <div class="number number-1"><span>1</span></div>
            <div class="number number-2"><span>2</span></div>
            <div class="number number-3"><span>3</span></div>
            <div class="number number-4"><span>4</span></div>
            <div class="number number-5"><span>5</span></div>
            <div class="number number-6"><span>6</span></div>
            <div class="number number-7"><span>7</span></div>
            <div class="number number-8"><span>8</span></div>
            <div class="number number-9"><span>9</span></div>
            <div class="number number-10"><span>10</span></div>
            <div class="number number-11"><span>11</span></div>

            <!-- Hands -->
            <div class="hands">
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
            </div>

            <!-- Center cap -->
            <div class="center-cap"></div>

            <!-- Digital readout -->
            <div class="digital-time" id="digitalTime"></div>
        </div>
    </div>

    <script>
        // Generate tick marks
        const tickMarks = document.getElementById('tickMarks');
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.classList.add('tick');
            if (i % 5 === 0) tick.classList.add('major');
            tick.style.transform = `rotate(${i * 6}deg)`;
            tickMarks.appendChild(tick);
        }

        // Clock hands
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const digitalTime = document.getElementById('digitalTime');

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Smooth second hand (with milliseconds)
            const secondAngle = (seconds + milliseconds / 1000) * 6;
            const minuteAngle = (minutes + seconds / 60) * 6;
            const hourAngle = ((hours % 12) + minutes / 60 + seconds / 3600) * 30;

            secondHand.style.transform = `rotate(${secondAngle}deg)`;
            minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
            hourHand.style.transform = `rotate(${hourAngle}deg)`;

            // Digital display
            const h = hours.toString().padStart(2, '0');
            const m = minutes.toString().padStart(2, '0');
            const s = seconds.toString().padStart(2, '0');
            digitalTime.textContent = `${h}:${m}:${s}`;

            requestAnimationFrame(updateClock);
        }

        updateClock();
    </script>
</body>
</html>
