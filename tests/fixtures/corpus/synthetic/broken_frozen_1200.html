<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Broken fixture — hands frozen at 12:00</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    .clock {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 8px solid #444;
      background: #f5f5f5;
      box-shadow: inset 0 0 0 2px #ddd;
    }
    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      background: #222;
      border-radius: 2px;
    }
    /* All hands fixed at 12 o'clock (0deg). Never updated. */
    .hour   { width: 6px;  height: 70px; margin-left: -3px; transform: rotate(0deg); }
    .minute { width: 4px;  height: 100px; margin-left: -2px; transform: rotate(0deg); }
    .second { width: 2px;  height: 110px; margin-left: -1px; background: #c00; transform: rotate(0deg); }
    .pivot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      background: #222;
    }
  </style>
</head>
<body>
  <!-- Intentional failure fixture for Phase 2 verifier:
       mentions rAF + getMilliseconds in comments/scripts so static precheck
       may look "smooth", but hands never move and stay at 12:00. -->
  <div class="clock" aria-label="broken analog clock">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="pivot"></div>
  </div>
  <script>
    // Bait for static_precheck: code looks like a proper sweep clock.
    // Runtime verifier must score time accuracy 0 (frozen at 12:00).
    function tick() {
      // Deliberately does not read Date or update transforms.
      requestAnimationFrame(tick);
    }
    const _ms = () => new Date().getMilliseconds();
    void _ms;
    requestAnimationFrame(tick);
  </script>
</body>
</html>
