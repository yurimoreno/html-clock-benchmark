<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        /* Basic Page Reset & Centering */
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* The Clock Face Container */
        .clock {
            width: 300px;
            height: 300px;
            background-color: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 
                        0 0 40px rgba(255, 255, 255, 0.2); /* Inner glow */
            border: 10px solid #ecf0f1;
        }

        /* The numbers (optional) */
        .clock::after {
            content: "12";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #333;
        }

        /* Common styles for all hands */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center; /* Pivot point at the bottom of the div */
            border-radius: 10px;
            transform: translateX(-50%); /* Counteract the left: 50% positioning */
            transition: transform 0.05s cubic-bezier(0.4, 2.3, 0.5, 0.8); /* Slight bounce effect */
        }

        /* The Hour Hand */
        .hour {
            width: 8px;
            height: 25%;
            background-color: #333;
            z-index: 1;
        }

        /* The Minute Hand */
        .minute {
            width: 6px;
            height: 40%;
            background-color: #555;
            z-index: 2;
        }

        /* The Second Hand */
        .second {
            width: 2px;
            height: 55%;
            background-color: #e74c3c; /* Red */
            z-index: 3;
            transform-origin: 50% 100%;
            transition: none; /* Smooth seconds, no bounce */
        }

        /* Center Dot (Pivot) */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background-color: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
        }
    </style>
</head>
<body>

    <!-- The Clock Face -->
    <div class="clock">
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="minute-hand"></div>
        <div class="hand second" id="second-hand"></div>
        <div class="center-dot"></div>
    </div>

    <script>
        // Select DOM elements
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');

        function setDate() {
            const now = new Date();

            // Get hours (0-23) -> modulo 12 for clock face (0-11)
            const hours = now.getHours() % 12; 
            
            // Add a small fraction of the hour based on minutes to make it smooth?
            // Optional: Uncomment next line for smoother hand movement
            // const hourRotation = ((hours + now.getMinutes() / 60) * 360) / 12;
            
            // Calculate rotation degrees
            const secondDegrees = ((now.getSeconds() + now.getMilliseconds() / 1000) / 60) * 360;
            const minuteDegrees = (now.getMinutes() + now.getSeconds() / 60) * 6;
            const hourDegrees = ((hours * 30) + (now.getMinutes() / 2)) % (360/12) * 12; 

            // Apply rotation
            secondHand.style.transform = `rotate(${secondDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
            hourHand.style.transform = `rotate(${hourDegrees}deg)`;
        }

        // Update every second (and slight milliseconds adjustment for smoothness)
        setInterval(setDate, 1000);
        
        // Run immediately so there is no delay on load
        setDate();
    </script>

</body>
</html>
