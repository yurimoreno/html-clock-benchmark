<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
  }
  .clock {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: #eee;
    position: relative;
    box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.1);
    border: 8px solid #333;
  }
  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
  }
  .hour {
    width: 6px;
    height: 70px;
    background: #333;
    margin-left: -3px;
  }
  .minute {
    width: 4px;
    height: 100px;
    background: #555;
    margin-left: -2px;
  }
  .second {
    width: 2px;
    height: 110px;
    background: #e74c3c;
    margin-left: -1px;
  }
  .center-dot {
    width: 12px;
    height: 12px;
    background: #e74c3c;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  .number {
    position: absolute;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    width: 40px;
    height: 40px;
    text-align: center;
    line-height: 40px;
  }
  .tick {
    position: absolute;
    width: 2px;
    height: 10px;
    background: #999;
    top: 10px;
    left: 50%;
    margin-left: -1px;
    transform-origin: center 140px;
  }
  .tick.major {
    width: 3px;
    height: 15px;
    background: #333;
    margin-left: -1.5px;
  }
</style>
</head>
<body>
<div class="clock">
  <div class="center-dot"></div>
  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>
</div>

<script>
  const clock = document.querySelector('.clock');

  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = i % 5 === 0 ? 'tick major' : 'tick';
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(tick);
  }

  for (let i = 1; i <= 12; i++) {
    const number = document.createElement('div');
    number.className = 'number';
    const angle = (i * 30 - 90) * (Math.PI / 180);
    const radius = 115;
    const x = 150 + radius * Math.cos(angle) - 20;
    const y = 150 + radius * Math.sin(angle) - 20;
    number.style.left = x + 'px';
    number.style.top = y + 'px';
    number.textContent = i;
    clock.appendChild(number);
  }

  function updateClock() {
    const now = new Date();
    const s = now.getSeconds();
    const m = now.getMinutes();
    const h = now.getHours();

    document.getElementById('second').style.transform = `rotate(${s * 6}deg)`;
    document.getElementById('minute').style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
    document.getElementById('hour').style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>
</body>
</html>
