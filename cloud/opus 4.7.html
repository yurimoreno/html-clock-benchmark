<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analog Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at center, #1e293b, #0f172a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .clock {
    position: relative;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fafafa, #d1d5db);
    box-shadow:
      0 0 0 12px #1f2937,
      0 0 0 14px #f8fafc,
      0 25px 60px rgba(0, 0, 0, 0.5),
      inset 0 0 30px rgba(0, 0, 0, 0.1);
  }

  .number {
    position: absolute;
    width: 40px;
    height: 40px;
    left: 50%;
    top: 50%;
    margin-left: -20px;
    margin-top: -20px;
    text-align: center;
    line-height: 40px;
    font-size: 22px;
    font-weight: 600;
    color: #0f172a;
  }

  .tick {
    position: absolute;
    left: 50%;
    top: 4px;
    width: 2px;
    height: 10px;
    background: #475569;
    transform-origin: 50% 176px;
    margin-left: -1px;
  }

  .tick.major {
    width: 3px;
    height: 14px;
    background: #0f172a;
    transform-origin: 50% 176px;
    margin-left: -1.5px;
  }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    transition: transform 0.05s cubic-bezier(0.4, 2.5, 0.6, 1);
  }

  .hour {
    width: 8px;
    height: 90px;
    margin-left: -4px;
    background: #0f172a;
  }

  .minute {
    width: 5px;
    height: 130px;
    margin-left: -2.5px;
    background: #1e293b;
  }

  .second {
    width: 2px;
    height: 145px;
    margin-left: -1px;
    background: #dc2626;
    transition: transform 0.1s cubic-bezier(0.4, 2.5, 0.6, 1);
  }

  .center-cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    margin-top: -8px;
    background: #dc2626;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #0f172a, 0 2px 6px rgba(0, 0, 0, 0.3);
    z-index: 10;
  }

  .brand {
    position: absolute;
    left: 50%;
    top: 68%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 3px;
    color: #64748b;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="brand">Quartz</div>
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
    <div class="center-cap"></div>
  </div>

<script>
  const clock = document.getElementById('clock');
  const radius = 180;

  // Place numbers 1-12
  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30 - 90) * (Math.PI / 180);
    const r = radius - 32;
    const x = radius + Math.cos(angle) * r;
    const y = radius + Math.sin(angle) * r;
    const num = document.createElement('div');
    num.className = 'number';
    num.textContent = i;
    num.style.left = x + 'px';
    num.style.top = y + 'px';
    num.style.marginLeft = '-20px';
    num.style.marginTop = '-20px';
    clock.appendChild(num);
  }

  // Place tick marks
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(tick);
  }

  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');

  function updateClock() {
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    const hourDeg = h * 30;
    const minuteDeg = m * 6;
    const secondDeg = s * 6;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
    secondHand.style.transform = `rotate(${secondDeg}deg)`;
  }

  updateClock();
  setInterval(updateClock, 50);
</script>
</body>
</html>
