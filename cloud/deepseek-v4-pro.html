<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
    }
    .clock-container {
      position: relative;
      width: 350px;
      height: 350px;
    }
    svg { width: 100%; height: 100%; }
    .face { fill: #16213e; stroke: #e94560; stroke-width: 6; }
    .tick { stroke: #e2e2e2; stroke-width: 2; }
    .tick-major { stroke: #e94560; stroke-width: 3; }
    .number {
      fill: #e2e2e2;
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .hand-hour   { stroke: #e94560; stroke-width: 6; stroke-linecap: round; }
    .hand-minute { stroke: #e2e2e2; stroke-width: 4; stroke-linecap: round; }
    .hand-second { stroke: #f5c518; stroke-width: 2; stroke-linecap: round; }
    .center-dot  { fill: #e94560; }
  </style>
</head>
<body>
  <div class="clock-container">
    <svg viewBox="-120 -120 240 240">
      <!-- Clock face -->
      <circle class="face" cx="0" cy="0" r="110"/>

      <!-- Tick marks -->
      <g id="ticks"></g>

      <!-- Numbers -->
      <g id="numbers"></g>

      <!-- Hands -->
      <line id="hour"   class="hand-hour"   x1="0" y1="0" x2="0" y2="-55"/>
      <line id="minute" class="hand-minute" x1="0" y1="0" x2="0" y2="-80"/>
      <line id="second" class="hand-second" x1="0" y1="0" x2="0" y2="-90"/>

      <!-- Center dot -->
      <circle class="center-dot" cx="0" cy="0" r="5"/>
    </svg>
  </div>

  <script>
    const svgNS = "http://www.w3.org/2000/svg";

    // Build tick marks (60)
    const ticksGroup = document.getElementById("ticks");
    for (let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * (Math.PI / 180);
      const inner = i % 5 === 0 ? 95 : 100;
      const cx = inner * Math.cos(angle);
      const cy = inner * Math.sin(angle);
      const ex = 107 * Math.cos(angle);
      const ey = 107 * Math.sin(angle);
      const tick = document.createElementNS(svgNS, "line");
      tick.setAttribute("x1", cx);
      tick.setAttribute("y1", cy);
      tick.setAttribute("x2", ex);
      tick.setAttribute("y2", ey);
      tick.setAttribute("class", i % 5 === 0 ? "tick-major" : "tick");
      ticksGroup.appendChild(tick);
    }

    // Build numbers 1–12
    const numbersGroup = document.getElementById("numbers");
    for (let i = 1; i <= 12; i++) {
      const angle = (i * 30 - 90) * (Math.PI / 180);
      const r = 80;
      const x = r * Math.cos(angle);
      const y = r * Math.sin(angle);
      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("class", "number");
      text.textContent = i;
      numbersGroup.appendChild(text);
    }

    // Get hand elements
    const hourHand  = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");

    function rotate(el, deg) {
      el.setAttribute("transform", `rotate(${deg})`);
    }

    function animate() {
      const now = new Date();
      const ms = now.getMilliseconds();

      const seconds = now.getSeconds() + ms / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours   = (now.getHours() % 12) + minutes / 60;

      rotate(secondHand, seconds * 6);
      rotate(minuteHand, minutes * 6);
      rotate(hourHand,   hours * 30);
    }

    setInterval(animate, 50);
    animate();
  </script>
</body>
</html>
